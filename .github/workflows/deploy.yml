name: Deploy

# Builds the Astro site and publishes it to GitHub Pages. Replaces the
# fastpages `ci.yaml`, which built Jekyll inside an unmaintained Docker image
# and pushed the result to the `gh-pages` branch.
#
# Publishing is now Pages' own artifact flow rather than a branch: nothing
# commits to the repository, so `gh-pages` stops being written to and remains
# as the record of the old site.
on:
  push:
    branches: [master]
  workflow_dispatch:

# The site is whatever `master` last built. Queue a run behind one already in
# flight rather than cancelling it, so a deploy is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Reads the repo. Only `deploy` gets the tokens that publish.
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` is `astro build` followed by the Pagefind index, so
      # search ships with the site rather than being generated separately.
      - name: Build
        run: npm run build

      # The custom domain lives in `public/CNAME`, so it is copied into `dist/`
      # by the build and needs no step of its own here.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # `pages: write` and `id-token: write` are what `deploy-pages` requires;
    # they are scoped to this job so the build never holds them.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
